<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650"><rect width="940" height="650" fill="#101820"/><g font-family="Arial,sans-serif" fill="#eef3f6"><text x="28" y="42" font-size="24">Пальмовая крона: почему важен порядок обработки</text><text x="28" y="73" font-size="15" fill="#adbcc6">Масштаб из кода; это схема размеров, не карта свободных мест в тестовом мире.</text></g><polygon points="192.06,370.00 114.12,415.00 36.17,370.00 36.17,280.00 114.12,235.00 192.06,280.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="270.00,505.00 192.06,550.00 114.12,505.00 114.12,415.00 192.06,370.00 270.00,415.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="270.00,235.00 192.06,280.00 114.12,235.00 114.12,145.00 192.06,100.00 270.00,145.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="347.94,370.00 270.00,415.00 192.06,370.00 192.06,280.00 270.00,235.00 347.94,280.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="425.88,505.00 347.94,550.00 270.00,505.00 270.00,415.00 347.94,370.00 425.88,415.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="425.88,235.00 347.94,280.00 270.00,235.00 270.00,145.00 347.94,100.00 425.88,145.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><polygon points="503.83,370.00 425.88,415.00 347.94,370.00 347.94,280.00 425.88,235.00 503.83,280.00" fill="#152a35" stroke="#466c7e" stroke-width="1.3"/><rect x="173.28888" y="226.69024000000002" width="193.42224000000002" height="196.61952" fill="#e6af4538" stroke="#e6af45" stroke-width="3"/><circle cx="270" cy="325" r="5" fill="#fff"/><g font-family="Arial,sans-serif" fill="#eef3f6" font-size="18"><text x="555" y="165">Крона: 3.224 × 3.277 wu</text><text x="555" y="195">Радиус гекса: 1.5 wu</text><text x="555" y="245" fill="#78b8d0">Синий: область поиска Drop</text><text x="555" y="273">текущий гекс + 6 соседних.</text><text x="555" y="320" fill="#e6af45">Жёлтый: горизонтальный габарит</text><text x="555" y="348">кроны из GroundPileCatalog.</text><text x="555" y="403">Свободный узел сам по себе</text><text x="555" y="431">не доказывает место для кроны.</text><text x="28" y="568" fill="#c2ef83">Порядок навыка: обработать лежащую крону → подобрать листья.</text><text x="28" y="604" font-size="13" fill="#adbcc6">Источники: HexSpatialMath.cs; GroundItemPlacement.Find; GroundPileCatalog.cs, resource.palm_crown.</text></g></svg>