<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Баг #158 — интерполяция помощи через дверной портал</title>
  <desc id="desc">Реальные junction координаты хижины seed -28147312. Прямая хорда пересекает стену; восстановленный маршрут проходит через portal j1221.</desc>
