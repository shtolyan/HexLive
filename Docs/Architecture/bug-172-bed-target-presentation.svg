<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Баг 172: одна кровать и две разные позиции сна</title>
  <desc id="desc">До исправления вид приклеивал спящую без bed target к ближайшей кровати; после исправления она остаётся на своей позиции сетки.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2b6cb0"/>
    </marker>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="3.5" fill="#9aa5b1" opacity="0.7"/>
    </pattern>
    <style>
      .title{font:700 23px system-ui,sans-serif;fill:#17212b}
      .sub{font:600 17px system-ui,sans-serif;fill:#34495e}
      .label{font:15px system-ui,sans-serif;fill:#263645}
      .small{font:13px system-ui,sans-serif;fill:#52616b}
      .bed{fill:#c99b59;stroke:#6f4e26;stroke-width:3}
      .bodyA{fill:#4da3ff;fill-opacity:.72;stroke:#155da0;stroke-width:2}
      .bodyB{fill:#ef6f6c;fill-opacity:.72;stroke:#a32929;stroke-width:2}
      .node{fill:#fff;stroke:#596773;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f6f8fa"/>
  <text x="600" y="36" text-anchor="middle" class="title">#172 — одна кровать, две разные позиции симуляции</text>
  <text x="600" y="61" text-anchor="middle" class="small">шаг interior-сетки 0.375 wu · footprint кровати 1.500 wu · тело 1.32 × 0.36 wu</text>

  <g transform="translate(30 85)">
    <rect width="550" height="455" rx="18" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <text x="275" y="34" text-anchor="middle" class="sub">До commit 1277e65d…</text>
    <text x="275" y="58" text-anchor="middle" class="small">вид угадывал ближайшую кровать при TargetObjectId = null</text>
    <rect x="35" y="82" width="480" height="300" fill="url(#grid)" stroke="#e3e8ec"/>

    <!-- 0.375 wu = 60 px. Five authored footprint nodes span 1.5 wu. -->
    <rect x="160" y="184" width="240" height="88" rx="18" class="bed"/>
    <line x1="160" y1="228" x2="400" y2="228" stroke="#6f4e26" stroke-width="4"/>
    <circle cx="160" cy="228" r="7" class="node"/>
    <circle cx="220" cy="228" r="7" class="node"/>
    <circle cx="280" cy="228" r="7" class="node"/>
    <circle cx="340" cy="228" r="7" class="node"/>
    <circle cx="400" cy="228" r="7" class="node"/>
    <text x="280" y="173" text-anchor="middle" class="small">bed footprint: 5 узлов, 1.500 wu</text>

    <!-- Body length 1.32 wu = 211.2 px, width .36 wu = 57.6 px. -->
    <rect x="174.4" y="199.2" width="211.2" height="57.6" rx="28" class="bodyA"/>
    <rect x="174.4" y="199.2" width="211.2" height="57.6" rx="28" class="bodyB" stroke-dasharray="8 5"/>
    <text x="280" y="223" text-anchor="middle" class="label">A: bed id</text>
    <text x="280" y="244" text-anchor="middle" class="label">B: null → fallback</text>

    <circle cx="280" cy="288" r="7" class="node"/>
    <path d="M280 288 C330 315 420 292 395 258" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="365" y="321" text-anchor="middle" class="small">позиция B на земле в 0.375 wu</text>
    <text x="275" y="413" text-anchor="middle" class="label">Ошибка: обе модели получают один bed attach-point</text>
    <text x="275" y="437" text-anchor="middle" class="small">симуляция и TargetObjectId при этом не расходятся</text>
  </g>

  <g transform="translate(620 85)">
    <rect width="550" height="455" rx="18" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <text x="275" y="34" text-anchor="middle" class="sub">После commit 1277e65d…</text>
    <text x="275" y="58" text-anchor="middle" class="small">attach к кровати только по собственному TargetObjectId</text>
    <rect x="35" y="82" width="480" height="300" fill="url(#grid)" stroke="#e3e8ec"/>

    <rect x="160" y="184" width="240" height="88" rx="18" class="bed"/>
    <line x1="160" y1="228" x2="400" y2="228" stroke="#6f4e26" stroke-width="4"/>
    <circle cx="160" cy="228" r="7" class="node"/>
    <circle cx="220" cy="228" r="7" class="node"/>
    <circle cx="280" cy="228" r="7" class="node"/>
    <circle cx="340" cy="228" r="7" class="node"/>
    <circle cx="400" cy="228" r="7" class="node"/>
    <text x="280" y="173" text-anchor="middle" class="small">одна циновка / один target</text>

    <rect x="174.4" y="199.2" width="211.2" height="57.6" rx="28" class="bodyA"/>
    <text x="280" y="233" text-anchor="middle" class="label">A: TargetObjectId = bed</text>

    <rect x="174.4" y="259.2" width="211.2" height="57.6" rx="28" class="bodyB"/>
    <text x="280" y="293" text-anchor="middle" class="label">B: TargetObjectId = null</text>
    <line x1="420" y1="228" x2="420" y2="288" stroke="#596773" stroke-width="2"/>
    <line x1="412" y1="228" x2="428" y2="228" stroke="#596773" stroke-width="2"/>
    <line x1="412" y1="288" x2="428" y2="288" stroke="#596773" stroke-width="2"/>
    <text x="450" y="263" class="small">0.375 wu</text>

    <text x="275" y="413" text-anchor="middle" class="label">Результат: A на кровати, B видна на земле рядом</text>
    <text x="275" y="437" text-anchor="middle" class="small">Mind-group дельты перевозит TargetObjectId до клиента</text>
  </g>

  <g transform="translate(55 565)">
    <rect x="0" y="-15" width="22" height="14" class="bodyA"/><text x="30" y="-3" class="small">NPC A — занимает кровать</text>
    <rect x="250" y="-15" width="22" height="14" class="bodyB"/><text x="280" y="-3" class="small">NPC B — сон на земле</text>
    <circle cx="550" cy="-8" r="5" class="node"/><text x="565" y="-3" class="small">junction grid</text>
    <rect x="750" y="-15" width="22" height="14" class="bed"/><text x="780" y="-3" class="small">авторская линия footprint; ширина контура условна</text>
  </g>
</svg>
