<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <style>
      .bg{fill:#11191c}.panel{fill:#1d292d;stroke:#60777e;stroke-width:2}.title{fill:#eef5f4;font:700 24px sans-serif}.label{fill:#d7e3e1;font:18px sans-serif}.small{fill:#9eb1b0;font:15px sans-serif}.crab{fill:#d87742;stroke:#ffb37d;stroke-width:3}.route{stroke:#70d5e7;stroke-width:5;fill:none;marker-end:url(#arrow)}.axis{stroke:#ffd15c;stroke-width:4;fill:none;marker-end:url(#gold)}.measure{stroke:#84c996;stroke-width:3;fill:none}.hex{fill:none;stroke:#4f6268;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#70d5e7"/></marker>
    <marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ffd15c"/></marker>
  </defs>
  <rect class="bg" width="960" height="520"/>
  <text class="title" x="34" y="42">§29C.3 · Краб: половинный размер и боковое движение</text>

  <rect class="panel" x="34" y="72" width="892" height="330" rx="16"/>
  <polygon class="hex" points="722,110 851.9,185 851.9,335 722,410 592.1,335 592.1,185"/>
  <text class="small" x="694" y="94">HexRadius = 1,5 wu</text>

  <path class="route" d="M110 260 L790 260"/>
  <text class="label" x="104" y="238">route / root-forward = 0°</text>

  <g transform="translate(520 260)">
    <ellipse class="crab" cx="0" cy="0" rx="30" ry="72"/>
    <path class="crab" d="M-24,-48 L-62,-78 M24,-48 L62,-78 M-30,-18 L-72,-35 M30,-18 L72,-35 M-30,18 L-72,35 M30,18 L72,35 M-24,48 L-62,78 M24,48 L62,78"/>
    <path class="axis" d="M0 0 L0 -112"/>
    <text class="small" x="14" y="-92">body-forward</text>
    <text class="label" x="14" y="-68">yaw +90°</text>
  </g>

  <path class="measure" d="M432 350 L608 350 M432 340 L432 360 M608 340 L608 360"/>
  <text class="label" x="446" y="384">0,16 × 1,5 = 0,24 wu</text>

  <rect class="panel" x="34" y="426" width="892" height="66" rx="12"/>
  <text class="label" x="58" y="458">Было: 0,32 × 1,5 = 0,48 wu</text>
  <text class="label" x="520" y="458">Стало: 0,24 wu (ровно ½)</text>
  <text class="small" x="58" y="482">Симуляционная позиция, маршрут, бой и скорость не меняются — поворачивается только дочерний Body.</text>
</svg>
