<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <style>
      .bg{fill:#0d1418}.panel{fill:#162128;stroke:#58717c;stroke-width:2}.title{fill:#edf4f3;font:700 25px sans-serif}.label{fill:#dce8e8;font:18px sans-serif}.small{fill:#9fb2b4;font:15px sans-serif}.number{fill:#ffc95a;font:700 18px sans-serif}.world{fill:#263c30;stroke:#78b786;stroke-width:2}.input{fill:#202d38;stroke:#65cce1;stroke-width:2}.action{fill:#352d20;stroke:#ffc95a;stroke-width:2}.arrow{stroke:#65cce1;stroke-width:4;fill:none;marker-end:url(#m)}.same{stroke:#78d79a;stroke-width:5;fill:none}.muted{stroke:#738186;stroke-width:2;stroke-dasharray:8 6;fill:none}.cross{stroke:#ff6b63;stroke-width:5}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#65cce1"/></marker>
  </defs>
  <rect class="bg" width="1200" height="860"/>
  <text class="title" x="42" y="44">§150.4 · World-space импосторы дальнего обзора (анти-bug-230)</text>

  <!-- Ось зума с двумя гистерезисами -->
  <rect class="panel" x="42" y="78" width="1116" height="200" rx="16"/>
  <text class="label" x="68" y="112">Два гистерезиса на оси дистанции камеры 0,7–260 wu</text>
  <line class="muted" x1="100" y1="180" x2="1102" y2="180"/>
  <circle cx="140" cy="180" r="9" fill="#78d79a"/><text class="number" x="110" y="214">0,7 wu</text>
  <circle cx="300" cy="180" r="9" fill="#78d79a"/><text class="number" x="268" y="214">28 wu</text>
  <circle cx="340" cy="180" r="9" fill="#ffc95a"/><text class="number" x="310" y="152">32 wu</text>
  <circle cx="560" cy="180" r="9" fill="#78d79a"/><text class="number" x="528" y="214">56 wu</text>
  <circle cx="640" cy="180" r="9" fill="#ffc95a"/><text class="number" x="610" y="152">64 wu</text>
  <circle cx="1040" cy="180" r="9" fill="#78d79a"/><text class="number" x="1006" y="214">260 wu</text>
  <path class="muted" d="M100 236 L340 236"/><text class="small" x="108" y="230">трава видима (возврат ≤ 28)</text>
  <line class="cross" x1="340" y1="236" x2="1102" y2="236"/><text class="small" x="700" y="230">трава скрыта (≥ 32)</text>
  <path class="muted" d="M100 258 L640 258"/><text class="small" x="108" y="272">флора, вещи, люди — настоящие меши (возврат ≤ 56)</text>
  <line class="cross" x1="640" y1="258" x2="1102" y2="258"/><text class="small" x="740" y="272">импосторы (≥ 64)</text>

  <!-- Меш и квад в одном якоре -->
  <rect class="panel" x="42" y="306" width="540" height="300" rx="16"/>
  <text class="label" x="68" y="342">Меш ↔ квад: один мировой якорь</text>
  <!-- пальма-меш -->
  <line x1="170" y1="560" x2="170" y2="440" stroke="#8a6b4a" stroke-width="10"/>
  <path d="M170 440 L120 410 M170 440 L150 396 M170 440 L196 398 M170 440 L222 414" stroke="#78b786" stroke-width="7" fill="none"/>
  <circle cx="170" cy="560" r="6" fill="#ffc95a"/>
  <text class="small" x="120" y="588">якорь GetObjectAnchorPosition</text>
  <!-- стрелка -->
  <path class="arrow" d="M280 470 L360 470"/>
  <text class="small" x="278" y="452">≥ 64 wu</text>
  <!-- квад -->
  <rect x="400" y="400" width="120" height="140" fill="#20303a" stroke="#65cce1" stroke-width="2"/>
  <path d="M460 540 L460 428 M460 428 L426 408 M460 428 L492 408" stroke="#78b786" stroke-width="5" fill="none" opacity="0.85"/>
  <circle cx="460" cy="560" r="6" fill="#ffc95a"/>
  <text class="small" x="392" y="588">тот же якорь; квад = MeshRenderer+MeshFilter</text>
  <text class="small" x="68" y="470">forceRenderingOff</text>
  <text class="small" x="68" y="492">со save/restore,</text>
  <text class="small" x="68" y="514">без SetActive</text>

  <!-- Пекарня -->
  <rect class="panel" x="618" y="306" width="540" height="300" rx="16"/>
  <text class="label" x="644" y="342">Пекарня текстур (фронт включения, меши ещё видимы)</text>
  <rect class="input" x="644" y="366" width="220" height="92" rx="10"/>
  <text class="small" x="660" y="394">вид definitionId →</text>
  <text class="small" x="660" y="416">слой Portrait на кадр</text>
  <text class="small" x="660" y="438">(главная камера не видит)</text>
  <path class="arrow" d="M876 412 L930 412"/>
  <rect class="action" x="940" y="366" width="200" height="92" rx="10"/>
  <text class="small" x="956" y="394">ортокамера 256²</text>
  <text class="small" x="956" y="416">SubmitRenderRequest</text>
  <text class="small" x="956" y="438">(не camera.Render)</text>
  <rect class="world" x="644" y="488" width="496" height="96" rx="10"/>
  <text class="small" x="660" y="516">материал общий на definition · URP/Unlit cutout · инстансинг</text>
  <text class="small" x="660" y="538">размер квада = реальный габарит меша · переснимается раз в игровой день</text>
  <text class="small" x="660" y="560">биллборд: один кватернион на все квады в LateUpdate рендерера</text>

  <!-- Путь клика -->
  <rect class="panel" x="42" y="634" width="1116" height="170" rx="16"/>
  <text class="label" x="68" y="670">Клик на любом зуме — тот же аналитический путь</text>
  <rect class="input" x="72" y="694" width="230" height="84" rx="10"/>
  <text class="small" x="90" y="722">луч мыши</text>
  <text class="small" x="90" y="746">TryHandleManualClick</text>
  <path class="arrow" d="M314 736 L390 736"/>
  <rect class="world" x="400" y="694" width="330" height="84" rx="10"/>
  <text class="small" x="418" y="722">WorldObjectView._renderers</text>
  <text class="small" x="418" y="746">квад внутри → MeshRayPicker по его мешу</text>
  <path class="arrow" d="M742 736 L818 736"/>
  <rect class="action" x="828" y="694" width="312" height="84" rx="10"/>
  <text class="small" x="846" y="722">тот же объект, то же меню/команда;</text>
  <text class="small" x="846" y="746">SmallProps-отсечка не бьёт активный импостор</text>

  <text class="small" x="42" y="836">Константы кода: трава 28/32 wu · импосторы 56/64 wu · орбита 0,7–260 wu · бейк 256² · слой квада Default (SmallProps-cull 45 wu не применяется).</text>
</svg>
