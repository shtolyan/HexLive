<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
  <defs>
    <style>
      .bg{fill:#171a1c}.hex{fill:#22272a;stroke:#667178;stroke-width:3}.grid{fill:none;stroke:#4d585e;stroke-width:1.5}
      .free{fill:#55c58a}.busy{fill:#e86370}.amber{fill:#f4ad4e}.wall{stroke:#f4ad4e;stroke-width:12;stroke-linecap:round}
      .roof{fill:#4a7f63;fill-opacity:.62;stroke:#76c69a;stroke-width:3}.txt{fill:#edf2f4;font:18px sans-serif}.small{fill:#b9c3c8;font:15px sans-serif}
      .box{fill:#242a2e;stroke:#667178;stroke-width:2}.arrow{stroke:#76c69a;stroke-width:4;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#76c69a"/></marker>
  </defs>
  <rect class="bg" width="940" height="560"/>
  <text class="txt" x="28" y="38">§120.10 — свободное строительство: абсолютная сетка, без якоря дома</text>

  <!-- R=1.5 wu, 100 px/wu. Adjacent centre shift = sqrt(3)*R = 2.598 wu. -->
  <polygon class="hex" points="389.904,185 260,110 130.096,185 130.096,335 260,410 389.904,335"/>
  <polygon class="hex" points="649.712,185 519.808,110 389.904,185 389.904,335 519.808,410 649.712,335"/>

  <path class="grid" d="M260,260 L389.904,185 M260,260 L260,110 M260,260 L130.096,185 M260,260 L130.096,335 M260,260 L260,410 M260,260 L389.904,335"/>
  <path class="grid" d="M519.808,260 L649.712,185 M519.808,260 L519.808,110 M519.808,260 L389.904,185 M519.808,260 L389.904,335 M519.808,260 L519.808,410 M519.808,260 L649.712,335"/>
  <polygon class="roof" points="519.808,260 649.712,185 519.808,110"/>

  <!-- One exact 1.5-wu edge split into three 0.5-wu bays. -->
  <line class="wall" x1="130.096" y1="185" x2="173.397" y2="160"/>
  <line class="wall" x1="173.397" y1="160" x2="216.699" y2="135"/>
  <line class="wall" x1="216.699" y1="135" x2="260" y2="110"/>
  <circle class="busy" cx="130.096" cy="185" r="8"/><circle class="busy" cx="173.397" cy="160" r="8"/>
  <circle class="busy" cx="216.699" cy="135" r="8"/><circle class="busy" cx="260" cy="110" r="8"/>
  <circle class="free" cx="260" cy="260" r="8"/><circle class="free" cx="519.808" cy="260" r="8"/>
  <circle class="amber" cx="649.712" cy="185" r="10"/><circle class="amber" cx="519.808" cy="110" r="10"/>

  <text class="small" x="90" y="90">R = 1,5 wu</text>
  <text class="small" x="86" y="450">грань = 3 × 0,5 wu; каждый пролёт — свой ObjectId</text>
  <text class="small" x="456" y="438">сектор крыши ждёт опоры своего ребра</text>

  <path class="arrow" d="M680,250 C730,250 742,180 786,180"/>
  <rect class="box" x="760" y="92" width="158" height="176" rx="12"/>
  <text class="txt" x="780" y="124">Жест мыши</text>
  <text class="small" x="780" y="154">absolute SlotKey</text>
  <text class="small" x="780" y="178">↓</text>
  <text class="small" x="780" y="202">отдельный site</text>
  <text class="small" x="780" y="226">bill + progress</text>
  <text class="small" x="780" y="250">save + topology</text>

  <rect class="box" x="690" y="340" width="228" height="154" rx="12"/>
  <text class="txt" x="710" y="375">Чего здесь НЕТ</text>
  <text class="small" x="710" y="407">• выбора участка</text>
  <text class="small" x="710" y="433">• BlueprintId</text>
  <text class="small" x="710" y="459">• общего объекта «дом»</text>
  <text class="small" x="710" y="485">• требования замкнуть комнату</text>
</svg>
