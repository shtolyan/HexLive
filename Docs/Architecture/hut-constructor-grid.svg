<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Геометрия многогексного конструктора HexLive</title>
  <desc id="desc">Архитектурная сетка шага 0.5 wu, восемнадцать стеновых секций, шесть секторов пола и навигационные junction шага 0.375 wu с одним дверным порталом.</desc>
  <defs>
    <style>
      .bg{fill:#171a1d}.grid{stroke:#59626a;stroke-width:1;opacity:.46}.hex{fill:#22282d;stroke:#87929a;stroke-width:3}.sector{stroke:#68737b;stroke-width:1.5;fill:none}.wall{stroke:#d4a35d;stroke-width:10;stroke-linecap:round}.door{stroke:#55c893;stroke-width:12;stroke-linecap:round}.node{fill:#f0b45c;stroke:#171a1d;stroke-width:2}.junction{fill:#6e7b84;opacity:.8}.portal{fill:#55c893;stroke:#d9fff0;stroke-width:3}.support{fill:#f0b45c;stroke:#fff1d1;stroke-width:3}.label{fill:#e7ecef;font:18px system-ui,sans-serif}.small{fill:#bdc7cd;font:15px system-ui,sans-serif}.heading{fill:#f0b45c;font:600 28px system-ui,sans-serif}.legend{fill:#d9e0e4;font:16px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="760" rx="18"/>
  <text class="heading" x="52" y="55">Конструктор: две согласованные сетки</text>

  <!-- pointy-top R=1.5, screen scale 160 px/wu: vertices calculated from code -->
  <g transform="translate(410 380)">
    <path class="hex" d="M0,-240 L207.846,-120 L207.846,120 L0,240 L-207.846,120 L-207.846,-120 Z"/>
    <!-- six floor/roof sectors -->
    <path class="sector" d="M0,0 L0,-240 M0,0 L207.846,-120 M0,0 L207.846,120 M0,0 L0,240 M0,0 L-207.846,120 M0,0 L-207.846,-120"/>

    <!-- architecture lattice, 0.5 wu = 80 px, three equal sections per edge -->
    <path class="wall" d="M0,-240 L69.282,-200 M69.282,-200 L138.564,-160 M138.564,-160 L207.846,-120
      M207.846,-120 L207.846,-40 M207.846,-40 L207.846,40 M207.846,40 L207.846,120
      M207.846,120 L138.564,160 M138.564,160 L69.282,200 M69.282,200 L0,240
      M0,240 L-69.282,200 M-69.282,200 L-138.564,160 M-138.564,160 L-207.846,120
      M-207.846,120 L-207.846,40 M-207.846,40 L-207.846,-40 M-207.846,-40 L-207.846,-120
      M-207.846,-120 L-138.564,-160 M-138.564,-160 L-69.282,-200 M-69.282,-200 L0,-240"/>
    <!-- replace exactly one middle wall segment by door -->
    <path class="door" d="M-207.846,40 L-207.846,-40"/>

    <!-- build nodes -->
    <g>
      <circle class="node" cx="0" cy="-240" r="7"/><circle class="node" cx="69.282" cy="-200" r="7"/><circle class="node" cx="138.564" cy="-160" r="7"/><circle class="node" cx="207.846" cy="-120" r="7"/>
      <circle class="node" cx="207.846" cy="-40" r="7"/><circle class="node" cx="207.846" cy="40" r="7"/><circle class="node" cx="207.846" cy="120" r="7"/>
      <circle class="node" cx="138.564" cy="160" r="7"/><circle class="node" cx="69.282" cy="200" r="7"/><circle class="node" cx="0" cy="240" r="7"/>
      <circle class="node" cx="-69.282" cy="200" r="7"/><circle class="node" cx="-138.564" cy="160" r="7"/><circle class="node" cx="-207.846" cy="120" r="7"/>
      <circle class="node" cx="-207.846" cy="40" r="7"/><circle class="node" cx="-207.846" cy="-40" r="7"/><circle class="node" cx="-207.846" cy="-120" r="7"/>
      <circle class="node" cx="-138.564" cy="-160" r="7"/><circle class="node" cx="-69.282" cy="-200" r="7"/>
    </g>

    <!-- interior navigation lattice: q,r radius 3, spacing 0.375 wu -->
    <g>
      <circle class="junction" cx="0" cy="0" r="4"/>
      <circle class="junction" cx="51.962" cy="30" r="4"/><circle class="junction" cx="0" cy="60" r="4"/><circle class="junction" cx="-51.962" cy="30" r="4"/><circle class="junction" cx="-51.962" cy="-30" r="4"/><circle class="junction" cx="0" cy="-60" r="4"/><circle class="junction" cx="51.962" cy="-30" r="4"/>
      <circle class="junction" cx="103.923" cy="60" r="4"/><circle class="junction" cx="51.962" cy="90" r="4"/><circle class="junction" cx="0" cy="120" r="4"/><circle class="junction" cx="-51.962" cy="90" r="4"/><circle class="junction" cx="-103.923" cy="60" r="4"/><circle class="junction" cx="-103.923" cy="0" r="4"/><circle class="junction" cx="-103.923" cy="-60" r="4"/><circle class="junction" cx="-51.962" cy="-90" r="4"/><circle class="junction" cx="0" cy="-120" r="4"/><circle class="junction" cx="51.962" cy="-90" r="4"/><circle class="junction" cx="103.923" cy="-60" r="4"/><circle class="junction" cx="103.923" cy="0" r="4"/>
      <circle class="junction" cx="155.885" cy="90" r="4"/><circle class="junction" cx="103.923" cy="120" r="4"/><circle class="junction" cx="51.962" cy="150" r="4"/><circle class="junction" cx="0" cy="180" r="4"/><circle class="junction" cx="-51.962" cy="150" r="4"/><circle class="junction" cx="-103.923" cy="120" r="4"/><circle class="junction" cx="-155.885" cy="90" r="4"/><circle class="junction" cx="-155.885" cy="30" r="4"/><circle class="junction" cx="-155.885" cy="-30" r="4"/><circle class="junction" cx="-155.885" cy="-90" r="4"/><circle class="junction" cx="-103.923" cy="-120" r="4"/><circle class="junction" cx="-51.962" cy="-150" r="4"/><circle class="junction" cx="0" cy="-180" r="4"/><circle class="junction" cx="51.962" cy="-150" r="4"/><circle class="junction" cx="103.923" cy="-120" r="4"/><circle class="junction" cx="155.885" cy="-90" r="4"/><circle class="junction" cx="155.885" cy="-30" r="4"/><circle class="junction" cx="155.885" cy="30" r="4"/>
    </g>
    <circle class="portal" cx="-207.846" cy="0" r="10"/>

    <!-- six perimeter supports; the roof needs any three -->
    <circle class="support" cx="0" cy="-240" r="9"/>
    <circle class="support" cx="207.846" cy="-120" r="9"/>
    <circle class="support" cx="207.846" cy="120" r="9"/>
    <circle class="support" cx="0" cy="240" r="9"/>
    <circle class="support" cx="-207.846" cy="120" r="9"/>
    <circle class="support" cx="-207.846" cy="-120" r="9"/>
    <path d="M0,0 L0,-240 L207.846,-120 Z" fill="#f0b45c" opacity=".10" stroke="#f0b45c" stroke-width="2" stroke-dasharray="8 7"/>
  </g>

  <g transform="translate(700 125)">
    <text class="label" x="0" y="0">Архитектура</text>
    <text class="small" x="0" y="30">R = 1,5 wu · build-шаг = 0,5 wu</text>
    <text class="small" x="0" y="57">3 секции на грань · 18 на периметр</text>
    <line class="wall" x1="0" y1="92" x2="75" y2="92"/><circle class="node" cx="0" cy="92" r="7"/><circle class="node" cx="75" cy="92" r="7"/>
    <text class="legend" x="98" y="98">один BuildSegmentKey</text>
    <path d="M0,150 L70,110 L140,150 Z" fill="#f0b45c" opacity=".12" stroke="#f0b45c" stroke-width="2"/>
    <text class="legend" x="165" y="137">пол / крыша:</text>
    <text class="small" x="165" y="162">сектор: центр + 2 вершины</text>
    <text class="small" x="165" y="184">опоры: любые 3 из 6 угловых</text>

    <text class="label" x="0" y="245">Навигация и мебель</text>
    <text class="small" x="0" y="275">junction-шаг = 0,375 wu</text>
    <circle class="junction" cx="8" cy="310" r="6"/><text class="legend" x="30" y="316">обычный junction</text>
    <circle class="portal" cx="8" cy="350" r="9"/><text class="legend" x="30" y="356">единственная точка двери</text>
    <text class="small" x="0" y="390">Дверь допустима только на средней</text>
    <text class="small" x="0" y="414">из трёх секций грани.</text>

    <text class="label" x="0" y="475">Overlay редактора</text>
    <circle cx="8" cy="510" r="7" fill="#55c893"/><text class="legend" x="30" y="516">свободно</text>
    <circle cx="8" cy="548" r="7" fill="#ee3d4a"/><text class="legend" x="30" y="554">занято / конфликт</text>
    <circle cx="8" cy="586" r="7" fill="#f0a133"/><text class="legend" x="30" y="592">выбранный footprint</text>
  </g>

  <text class="small" x="55" y="715">Координаты рассчитаны из BlueprintGeometry и HexPointLayout; Unity X/Z = simulation X/Y.</text>
</svg>
