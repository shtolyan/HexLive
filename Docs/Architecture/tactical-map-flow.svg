<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .bg{fill:#0d1418}.panel{fill:#162128;stroke:#58717c;stroke-width:2}.title{fill:#edf4f3;font:700 25px sans-serif}.label{fill:#dce8e8;font:18px sans-serif}.small{fill:#9fb2b4;font:15px sans-serif}.number{fill:#ffc95a;font:700 18px sans-serif}.world{fill:#263c30;stroke:#78b786;stroke-width:2}.input{fill:#202d38;stroke:#65cce1;stroke-width:2}.action{fill:#352d20;stroke:#ffc95a;stroke-width:2}.arrow{stroke:#65cce1;stroke-width:4;fill:none;marker-end:url(#m)}.same{stroke:#78d79a;stroke-width:5;fill:none}.muted{stroke:#738186;stroke-width:2;stroke-dasharray:8 6;fill:none}.cross{stroke:#ff6b63;stroke-width:5}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#65cce1"/></marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="42" y="44">§150 · Один настоящий мир и один click-path на дистанции 0,7–260 wu</text>

  <rect class="panel" x="42" y="78" width="1116" height="184" rx="16"/>
  <text class="label" x="68" y="112">Рендер при изменении Camera ↔ Pivot distance</text>
  <line class="muted" x1="100" y1="176" x2="1102" y2="176"/>
  <circle cx="184" cy="176" r="9" fill="#78d79a"/><text class="number" x="153" y="211">0,7 wu</text>
  <circle cx="337" cy="176" r="9" fill="#78d79a"/><text class="number" x="305" y="211">28 wu</text>
  <circle cx="377" cy="176" r="9" fill="#ffc95a"/><text class="number" x="345" y="151">32 wu</text>
  <circle cx="1030" cy="176" r="9" fill="#78d79a"/><text class="number" x="995" y="211">260 wu</text>
  <path class="same" d="M100 130 L1102 130"/>
  <text class="small" x="472" y="121">персонажи · деревья · юкка · ресурсы · мебель · VFX — настоящие меши всегда</text>
  <path class="muted" d="M100 235 L377 235"/>
  <text class="small" x="112" y="229">трава видима; возврат при ≤ 28 wu</text>
  <line class="cross" x1="377" y1="224" x2="1102" y2="224"/>
  <text class="small" x="660" y="250">трава скрыта при ≥ 32 wu</text>

  <rect class="panel" x="42" y="290" width="1116" height="328" rx="16"/>
  <text class="label" x="68" y="326">Левый и правый клик — одинаковая цепочка при любом зуме</text>

  <rect class="input" x="72" y="365" width="198" height="104" rx="12"/>
  <text class="label" x="94" y="400">Pointer position</text>
  <text class="small" x="94" y="428">near / distant</text>
  <text class="small" x="94" y="452">без overview-ветки</text>
  <path class="arrow" d="M282 417 L380 417"/>

  <rect class="world" x="394" y="352" width="272" height="130" rx="12"/>
  <text class="label" x="416" y="389">Обычный world pick</text>
  <text class="small" x="416" y="419">TryHandleManualClick</text>
  <text class="small" x="416" y="443">TryPickNpc / TryPickHex</text>
  <text class="small" x="416" y="467">TryHandleContextClick</text>

  <path class="arrow" d="M678 387 L784 387"/>
  <path class="arrow" d="M678 447 L784 504"/>
  <rect class="action" x="798" y="345" width="318" height="90" rx="12"/>
  <text class="label" x="820" y="382">Объект / персонаж</text>
  <text class="small" x="820" y="410">то же выделение или контекстное действие</text>
  <rect class="action" x="798" y="468" width="318" height="112" rx="12"/>
  <text class="label" x="820" y="505">Земля</text>
  <text class="small" x="820" y="533">тот же MoveTo / GroupMove</text>
  <text class="small" x="820" y="557">тот же world-marker «идти сюда»</text>

  <text class="small" x="72" y="594">HUD-мини-карта остаётся отдельной навигацией pivot; полноэкранный DistantWorldMarkersView не подключён.</text>
  <text class="small" x="42" y="654">Фактические константы кода: orbit min = 0,7 wu · show grass ≤ 28 wu · hide grass ≥ 32 wu · orbit max = 260 wu.</text>
</svg>
