<path d="M360 250 H425" stroke="#eef4f8" stroke-width="3"/><path d="M415 242 L427 250 L415 258" fill="none" stroke="#eef4f8" stroke-width="3"/>
<text x="795" y="155" font-size="17">Tile (-6,-26)</text>
<text x="795" y="185" font-size="15">world centre=(-49.36345, -58.5) wu</text>
<text x="795" y="215" font-size="15">Positive 60°: (q,r) → (-r,q+r)</text>
<text x="795" y="245" font-size="15">Clockwise sector index → sector−yawStep</text>
<text x="795" y="285" font-size="15">New plan alone does not count as floor.</text>
<text x="795" y="313" font-size="15">Count completed physical world slots.</text>
<text x="795" y="341" font-size="15">Paid queued removals remain physical.</text>
<path d="M30 450 H1150" stroke="#637683"/>
<text x="30" y="490" font-size="18">Edit existing wall → desired draft changes → paid OLD wall stays + red demolition stakes</text>
<text x="30" y="525" font-size="18">Axe/saw work finishes → release OLD blocking → floor(delivered/2) per material at its anchor</text>
<text x="30" y="560" font-size="18">Removed slot disappears; replacement starts EMPTY. Neighbour ObjectIds, paid progress and owner remain.</text>
<text x="30" y="603" font-size="14">Sources: BlueprintGeometry.BuildStep/CornerOffsets/RotateNode; HexSpatialMath.HexRadius/TileToWorld;</text>
<text x="30" y="626" font-size="14">ArchitectureWorldEditing.ToWorld; HouseArchitectureEditing.PhysicalPlan/RefreshWorldFlags/CompleteDemolition.</text>
<text x="30" y="655" font-size="14">No scale compensation or asset-specific yaw. Same integer coordinates feed preview, command and real topology.</text>
