  <rect width="1000" height="560" fill="#f8fafc"/>
  <text x="250" y="38" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="600" fill="#0f172a">Падение: пол сначала</text>
  <text x="750" y="38" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="600" fill="#0f172a">Плач: кровать сначала</text>

  <g transform="translate(250 270)">
    <polygon points="0,-172.5 149.39,-86.25 149.39,86.25 0,172.5 -149.39,86.25 -149.39,-86.25" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <use href="#interior-nodes"/>
    <circle cx="74.69" cy="0" r="51.75" fill="#f97316" fill-opacity="0.18" stroke="#ea580c" stroke-width="2"/>
    <circle cx="74.69" cy="0" r="8" fill="#dc2626"/>
    <circle cx="37.35" cy="-21.56" r="5" fill="#dc2626"/><circle cx="37.35" cy="21.56" r="5" fill="#dc2626"/>
    <circle cx="112.04" cy="-21.56" r="5" fill="#dc2626"/><circle cx="112.04" cy="21.56" r="5" fill="#dc2626"/>
    <rect x="-153.89" y="-21.6" width="158.4" height="43.2" rx="7" fill="#2563eb" fill-opacity="0.24" stroke="#2563eb" stroke-width="2"/>
    <circle cx="-149.38" cy="0" r="7" fill="#f59e0b"/><circle cx="-74.69" cy="0" r="7" fill="#f59e0b"/><circle cx="0" cy="0" r="7" fill="#f59e0b"/>
    <text x="74.69" y="-61" text-anchor="middle" font-family="system-ui" font-size="13" fill="#9a3412">твёрдая мебель: r=0.45 wu</text>
    <text x="-74.69" y="50" text-anchor="middle" font-family="system-ui" font-size="13" fill="#1e40af">тело 1.32 × 0.36 wu</text>
    <text x="-74.69" y="72" text-anchor="middle" font-family="system-ui" font-size="13" fill="#92400e">3 опоры: голова · центр · ноги</text>
  </g>

