<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Безопасное укладывание NPC возле мебели</title>
  <desc id="desc">Слева падение занимает безопасный прямоугольник тела и минимум три узла. Справа плач использует свободную кровать в том же гексе, когда она уже физически доступна.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2563eb"/>
    </marker>
    <g id="interior-nodes" fill="#94a3b8">
      <circle cx="0" cy="-129.38" r="3"/><circle cx="37.35" cy="-107.81" r="3"/><circle cx="74.69" cy="-86.25" r="3"/><circle cx="112.04" cy="-64.69" r="3"/>
      <circle cx="-37.35" cy="-107.81" r="3"/><circle cx="0" cy="-86.25" r="3"/><circle cx="37.35" cy="-64.69" r="3"/><circle cx="74.69" cy="-43.12" r="3"/><circle cx="112.04" cy="-21.56" r="3"/>
      <circle cx="-74.69" cy="-86.25" r="3"/><circle cx="-37.35" cy="-64.69" r="3"/><circle cx="0" cy="-43.12" r="3"/><circle cx="37.35" cy="-21.56" r="3"/><circle cx="74.69" cy="0" r="3"/><circle cx="112.04" cy="21.56" r="3"/>
      <circle cx="-112.04" cy="-64.69" r="3"/><circle cx="-74.69" cy="-43.12" r="3"/><circle cx="-37.35" cy="-21.56" r="3"/><circle cx="0" cy="0" r="3"/><circle cx="37.35" cy="21.56" r="3"/><circle cx="74.69" cy="43.12" r="3"/><circle cx="112.04" cy="64.69" r="3"/>
      <circle cx="-112.04" cy="-21.56" r="3"/><circle cx="-74.69" cy="0" r="3"/><circle cx="-37.35" cy="21.56" r="3"/><circle cx="0" cy="43.12" r="3"/><circle cx="37.35" cy="64.69" r="3"/><circle cx="74.69" cy="86.25" r="3"/>
      <circle cx="-112.04" cy="21.56" r="3"/><circle cx="-74.69" cy="43.12" r="3"/><circle cx="-37.35" cy="64.69" r="3"/><circle cx="0" cy="86.25" r="3"/><circle cx="37.35" cy="107.81" r="3"/>
      <circle cx="-112.04" cy="64.69" r="3"/><circle cx="-74.69" cy="86.25" r="3"/><circle cx="-37.35" cy="107.81" r="3"/><circle cx="0" cy="129.38" r="3"/>
