    <polygon points="0,-172.5 149.39,-86.25 149.39,86.25 0,172.5 -149.39,86.25 -149.39,-86.25" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <use href="#interior-nodes"/>
    <circle cx="0" cy="0" r="143.75" fill="#f97316" fill-opacity="0.08" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="-126.5" y="-69" width="253" height="138" rx="12" fill="#f59e0b" fill-opacity="0.23" stroke="#d97706" stroke-width="2"/>
    <rect x="-79.2" y="-21.6" width="158.4" height="43.2" rx="7" fill="#2563eb" fill-opacity="0.30" stroke="#2563eb" stroke-width="2"/>
    <circle cx="-149.39" cy="0" r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <path d="M-140 0H-86" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="0" y="-82" text-anchor="middle" font-family="system-ui" font-size="13" fill="#92400e">кровать 2.20 × 1.20 wu; ObstacleRadius=1.25 wu</text>
    <text x="0" y="92" text-anchor="middle" font-family="system-ui" font-size="13" fill="#1e40af">авторская attach-поза</text>
    <text x="0" y="113" text-anchor="middle" font-family="system-ui" font-size="13" fill="#334155">дистанция 1.30 wu ≤ reach 2.05 wu</text>
  </g>

  <g transform="translate(105 505)" font-family="system-ui" font-size="13" fill="#334155">
    <circle cx="0" cy="0" r="4" fill="#94a3b8"/><text x="12" y="5">37 внутренних узлов (шаг 0.375 wu)</text>
    <circle cx="260" cy="0" r="6" fill="#dc2626"/><text x="273" y="5">заблокировано мебелью</text>
    <circle cx="480" cy="0" r="6" fill="#f59e0b"/><text x="493" y="5">занято телом/кроватью</text>
    <rect x="700" y="-7" width="18" height="14" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb"/><text x="726" y="5">безопасная поза</text>
  </g>
  <text x="500" y="545" text-anchor="middle" font-family="system-ui" font-size="12" fill="#64748b">Масштаб геометрии: 115 px = 1 wu; HexRadius = 1.5 wu</text>
</svg>
