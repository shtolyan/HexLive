<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210"><rect width="920" height="210" fill="#171c23"/><g font-family="Segoe UI, sans-serif" fill="#eef2f6"><text x="25" y="32" font-size="23">Подъём без скольжения — #453</text><rect x="25" y="59" width="205" height="91" rx="12" fill="#344252"/><text x="50" y="103" font-size="19">Сидит / лежит</text><path d="M240 104 H290 M278 94 L290 104 L278 114" fill="none" stroke="#abbccc" stroke-width="3"/><rect x="302" y="59" width="343" height="91" rx="12" fill="#534724"/><text x="327" y="90" font-size="19">Встаёт: позиция закреплена</text><text x="327" y="118" font-size="16">Минимум 20 тиков = 5 с мира</text><path d="M657 104 H707 M695 94 L707 104 L695 114" fill="none" stroke="#abbccc" stroke-width="3"/><rect x="720" y="59" width="175" height="91" rx="12" fill="#274a36"/><text x="752" y="103" font-size="19">Идёт</text><text x="25" y="177" font-size="15">Авторский темп × скорость мира; срочный и ручной приказ ждут окончания подъёма.</text><text x="25" y="199" font-size="14">Подъём с колен: более длинное окно. Начатый полёт завершается посадкой.</text></g></svg>