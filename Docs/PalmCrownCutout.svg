<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24324a; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #29354a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4e5d73; }
      .num { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
      .measure { stroke: #5d6b80; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#5d6b80"/>
    </marker>
    <pattern id="cutHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="#f7fbff"/>
      <rect width="3" height="10" fill="#9ed7ff" opacity="0.72"/>
    </pattern>
    <clipPath id="sideCrownClip">
      <path d="M252 168 C285 112 383 88 518 91 C652 91 746 116 785 168 C744 218 655 233 518 233 C381 233 292 218 252 168 Z"/>
    </clipPath>
    <clipPath id="topCrownClip">
      <ellipse cx="949" cy="291" rx="185" ry="182"/>
    </clipPath>
  </defs>

  <rect width="1200" height="720" fill="#f4f7fb"/>
  <rect x="22" y="20" width="1156" height="680" rx="22" fill="#ffffff" stroke="#d9e1ed" stroke-width="2"/>
  <text x="52" y="62" class="title">§112 — сфера персонажа режет только верхушку растущей пальмы</text>
  <text x="52" y="88" class="small">Размеры взяты из HexRadius=1.5 wu и импортированных submesh-bounds palm_final_native</text>

  <!-- Side view -->
  <text x="54" y="127" class="head">Вид сбоку</text>
  <line x1="55" y1="600" x2="795" y2="600" stroke="#8e9aae" stroke-width="3"/>
  <text x="59" y="624" class="small">земля, y=0</text>

  <!-- palm: 130 px / wu; trunk 0..2.926, crown 2.822..3.915 -->
  <path d="M493 600 C494 497 489 389 497 220 L539 220 C547 389 542 497 543 600 Z"
        fill="#90643f" stroke="#68452d" stroke-width="3"/>
  <path d="M252 168 C285 112 383 88 518 91 C652 91 746 116 785 168 C744 218 655 233 518 233 C381 233 292 218 252 168 Z"
        fill="#66a84f" stroke="#397838" stroke-width="3"/>
  <path d="M518 166 C454 128 391 122 316 130 M518 164 C594 126 663 123 735 138
           M518 167 C439 177 365 195 303 216 M518 168 C596 180 667 196 731 218"
        fill="none" stroke="#3e823d" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- nominal fallback NPC centre x=420, y=0.66; radius=2.625 -->
  <circle cx="420" cy="514" r="341.25" fill="#62b9ff" fill-opacity="0.08"
          stroke="#168fe5" stroke-width="3" stroke-dasharray="12 9"/>
  <circle cx="420" cy="514" r="9" fill="#126da8"/>
  <path d="M405 600 L405 530 L435 530 L435 600 M405 556 L382 576 M435 556 L458 576
           M420 530 L420 497 M402 510 C402 487 438 487 438 510"
        fill="none" stroke="#31435e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- intersection: same sphere, clipped to crown -->
  <circle cx="420" cy="514" r="341.25" fill="url(#cutHatch)" clip-path="url(#sideCrownClip)"/>
  <path d="M252 168 C285 112 383 88 518 91 C652 91 746 116 785 168 C744 218 655 233 518 233 C381 233 292 218 252 168 Z"
        fill="none" stroke="#397838" stroke-width="3"/>
  <text x="275" y="250" class="text" fill="#126da8">заштрихованное внутри сферы → clip</text>

  <!-- measures -->
  <line x1="812" y1="600" x2="812" y2="91" class="measure"/>
  <text x="826" y="352" class="num">3.915 wu</text>
  <line x1="765" y1="233" x2="765" y2="91" class="measure"/>
  <text x="650" y="83" class="num">LeafGreen: y=2.822…3.915</text>
  <line x1="155" y1="514" x2="420" y2="514" class="measure"/>
  <text x="188" y="500" class="num">R=2.625 wu = 1.75×HexRadius</text>
  <text x="312" y="546" class="small">центр тела; fallback y=0.66 wu</text>
  <text x="520" y="468" class="small">WoodBark остаётся URP/Lit</text>

  <!-- Top view -->
  <text x="850" y="127" class="head">Срез у нижней границы кроны, y=2.822</text>
  <ellipse cx="949" cy="291" rx="185" ry="182" fill="#66a84f" stroke="#397838" stroke-width="3"/>
  <circle cx="949" cy="291" r="20" fill="#90643f" stroke="#68452d" stroke-width="3"/>
  <!-- horizontal cross-section radius at crown bottom: 1.489 wu => 134 px; NPC offset 0.75 wu => 67.5 px -->
  <circle cx="1017" cy="291" r="134" fill="url(#cutHatch)" clip-path="url(#topCrownClip)"/>
  <circle cx="1017" cy="291" r="134" fill="none" stroke="#168fe5" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="1017" cy="291" r="7" fill="#126da8"/>
  <text x="831" y="494" class="small">зелёный диск: LeafGreen, радиус ≈2.05 wu</text>
  <text x="831" y="516" class="small">синий срез сферы: радиус ≈1.489 wu на y=2.822</text>
  <text x="831" y="538" class="small">ближайшая позиция: 2 шага субсетки = 0.75 wu</text>

  <!-- dropped leaves -->
  <g transform="translate(848 578) rotate(-8)">
    <path d="M0 18 C55 -8 118 -8 180 20 C120 34 61 38 0 18 Z" fill="#66a84f" stroke="#397838" stroke-width="3"/>
    <path d="M15 19 L164 20" stroke="#397838" stroke-width="4"/>
  </g>
  <text x="842" y="645" class="text">упавшая крона / листья: исходный материал, без clip</text>

  <!-- legend -->
  <rect x="54" y="650" width="24" height="15" fill="#66a84f" stroke="#397838"/>
  <text x="87" y="663" class="small">только LeafGreen стоящей tree.palm</text>
  <rect x="323" y="650" width="24" height="15" fill="url(#cutHatch)" stroke="#168fe5"/>
  <text x="356" y="663" class="small">фрагменты внутри сферы отбрасываются</text>
  <rect x="646" y="650" width="24" height="15" fill="#90643f" stroke="#68452d"/>
  <text x="679" y="663" class="small">ствол и все наземные листья целы</text>
</svg>
