<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4ea"/>
    </linearGradient>
    <pattern id="hidden" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eef2f4"/>
      <rect width="3" height="10" fill="#aeb8bf"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1675b8"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324a; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526675; }
      .panelTitle { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324a; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #253746; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526675; }
      .num { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #126da8; }
      .ok { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #27753f; }
      .hideText { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8d3e37; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="40" y="42" class="title">§112 — LeafGreen становится shadow-only только рядом с объективом</text>
  <text x="40" y="69" class="subtitle">Один camera-manager · полная 3D-дистанция до bounds submesh · масштаб обеих схем 48 px / 1 wu</text>

  <!-- Near-camera panel. Geometry is calculated with 48 px/wu. -->
  <rect x="32" y="92" width="596" height="574" rx="18" fill="#ffffff" stroke="#bfd0dc" stroke-width="2"/>
  <text x="55" y="126" class="panelTitle">Близко: крона скрыта из color/depth</text>
  <text x="55" y="151" class="small">enter ≤ 2.1 wu · exit ≥ 2.5 wu · между ними сохраняется прежнее состояние</text>

  <!-- Crown AABB: x/z span 4.102 wu; y 2.822..3.915 wu. -->
  <rect x="80.55" y="282.08" width="438.90" height="293.26" rx="120" fill="none" stroke="#69a9d2" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="100.75" y="301.28" width="398.50" height="254.06" rx="100.8" fill="#dff2ff" fill-opacity="0.36" stroke="#168fe5" stroke-width="2"/>
  <text x="108" y="294" class="small">наружная граница восстановления: 2.5 wu</text>
  <text x="111" y="322" class="small" fill="#126da8">зона входа: до bounds ≤ 2.1 wu</text>

  <ellipse cx="305" cy="600" rx="118" ry="21" fill="#65716c" opacity="0.28" filter="url(#softShadow)"/>
  <ellipse cx="305" cy="598" rx="103" ry="14" fill="#58655e" opacity="0.33"/>
  <path d="M282 590 L287 450 L313 450 L320 590 Z" fill="#90643f" stroke="#68452d" stroke-width="3"/>
  <path d="M280 553 L319 553 M283 520 L316 520 M285 487 L314 487" stroke="#68452d" stroke-width="3" opacity="0.6"/>

  <g opacity="0.82">
    <ellipse cx="300" cy="429" rx="98.45" ry="26.25" fill="url(#hidden)" stroke="#66757f" stroke-width="2"/>
    <path d="M300 429 C252 386 216 389 202 419 C240 420 268 424 300 429 Z" fill="url(#hidden)" stroke="#66757f" stroke-width="2"/>
    <path d="M300 429 C348 386 384 389 398 419 C360 420 332 424 300 429 Z" fill="url(#hidden)" stroke="#66757f" stroke-width="2"/>
    <path d="M300 429 C263 448 224 459 205 448 C239 432 269 427 300 429 Z" fill="url(#hidden)" stroke="#66757f" stroke-width="2"/>
    <path d="M300 429 C337 448 376 459 395 448 C361 432 331 427 300 429 Z" fill="url(#hidden)" stroke="#66757f" stroke-width="2"/>
  </g>
  <rect x="201.55" y="402.08" width="196.90" height="52.46" fill="none" stroke="#405666" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="206" y="397" class="small">LeafGreen bounds</text>

  <!-- Near camera at 1.6 wu from the right AABB face. -->
  <g transform="translate(475.25 430)">
    <rect x="-16" y="-12" width="31" height="24" rx="5" fill="#126da8"/>
    <path d="M15 -7 L31 -14 L31 14 L15 7 Z" fill="#168fe5"/>
    <circle cx="-6" cy="0" r="5" fill="#dff2ff"/>
  </g>
  <line x1="399" y1="474" x2="474" y2="474" stroke="#1675b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="406" y="497" class="num">1.6 wu ≤ 2.1</text>
  <text x="55" y="625" class="hideText">LeafGreen → общий shadow-only материал</text>
  <text x="55" y="650" class="small">ствол виден · полная тень кроны остаётся</text>

  <!-- High-camera panel. -->
  <rect x="652" y="92" width="596" height="574" rx="18" fill="#ffffff" stroke="#bfd0dc" stroke-width="2"/>
  <text x="675" y="126" class="panelTitle">Высоко: исходная листва остаётся видимой</text>
  <text x="675" y="151" class="small">Проверяется ближайшая точка bounds в XYZ, а не расстояние по земле</text>

  <line x1="694" y1="590" x2="1218" y2="590" stroke="#7f9a70" stroke-width="3"/>
  <text x="1180" y="612" class="small">y = 0</text>
  <ellipse cx="938" cy="600" rx="118" ry="21" fill="#65716c" opacity="0.22" filter="url(#softShadow)"/>
  <path d="M925 590 L930 450 L956 450 L963 590 Z" fill="#90643f" stroke="#68452d" stroke-width="3"/>
  <path d="M923 553 L962 553 M926 520 L959 520 M928 487 L957 487" stroke="#68452d" stroke-width="3" opacity="0.6"/>

  <g>
    <ellipse cx="943" cy="429" rx="98.45" ry="26.25" fill="#66a84f" stroke="#397838" stroke-width="2"/>
    <path d="M943 429 C895 386 859 389 845 419 C883 420 911 424 943 429 Z" fill="#73b25a" stroke="#397838" stroke-width="2"/>
    <path d="M943 429 C991 386 1027 389 1041 419 C1003 420 975 424 943 429 Z" fill="#73b25a" stroke="#397838" stroke-width="2"/>
    <path d="M943 429 C906 448 867 459 848 448 C882 432 912 427 943 429 Z" fill="#5c9e48" stroke="#397838" stroke-width="2"/>
    <path d="M943 429 C980 448 1019 459 1038 448 C1004 432 974 427 943 429 Z" fill="#5c9e48" stroke="#397838" stroke-width="2"/>
  </g>
  <rect x="844.55" y="402.08" width="196.90" height="52.46" fill="none" stroke="#405666" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1048" y="421" class="small">верх: 3.915 wu</text>
  <text x="1048" y="445" class="small">низ: 2.822 wu</text>

  <!-- Camera y=9: y = 590 - 9*48 = 158. -->
  <g transform="translate(943 158)">
    <rect x="-16" y="-12" width="31" height="24" rx="5" fill="#126da8"/>
    <path d="M15 -7 L31 -14 L31 14 L15 7 Z" fill="#168fe5"/>
    <circle cx="-6" cy="0" r="5" fill="#dff2ff"/>
  </g>
  <text x="981" y="184" class="num">камера y = 9 wu</text>
  <line x1="943" y1="176" x2="943" y2="397" stroke="#1675b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="687" y="208" width="221" height="83" rx="12" fill="#edf8ee" stroke="#72aa7c"/>
  <text x="703" y="233" class="num">9 − 3.915 = 5.085 wu</text>
  <text x="703" y="257" class="ok">5.085 wu &gt; exit 2.5 wu</text>
  <text x="703" y="279" class="small">→ LeafGreen остаётся исходным</text>

  <!-- Fallen leaf, explicitly outside the registry. -->
  <g transform="translate(1071 548) rotate(-6)">
    <path d="M0 14 C35 -5 78 -5 119 16 C80 29 39 29 0 14 Z" fill="#66a84f" stroke="#397838" stroke-width="2"/>
    <path d="M10 15 L108 16" stroke="#397838" stroke-width="3"/>
  </g>
  <text x="990" y="625" class="small">упавшие кроны/листья</text>
  <text x="990" y="646" class="small">не регистрируются</text>
</svg>
