const $ = id => document.getElementById(id);
const SESSION_KEY = 'hexlive.session';
let lang='ru', theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
try { lang=localStorage.getItem('hexlive.language')==='en'?'en':'ru'; theme=localStorage.getItem('hexlive.theme')||theme; } catch {}
const t=(key,args={})=>Object.entries(args).reduce((s,[k,v])=>s.replaceAll('{'+k+'}',String(v)),strings[key]?.[lang==='en'?1:0]??key);

function el(tag,text,attrs={}) { const node=document.createElement(tag); if(text!==null)node.textContent=text; for(const [k,v]of Object.entries(attrs))node.setAttribute(k,String(v)); return node; }
function button(key,fn,primary=false) { const b=el('button',t(key),{type:'button',class:primary?'primary':''}); b.addEventListener('click',()=>run(fn)); return b; }
function message(key='',error=false) { notice=key;noticeError=error;$('status').textContent=key?t(key):'';$('status').className=error?'error':''; }
function storageGet(key) {
 let raw;try { raw=localStorage.getItem(key); } catch { throw {code:'storage'}; }
 try { return JSON.parse(raw||'null'); } catch { storageSet(key,null);return null; }
}
function storageSet(key,value) { try { value===null?localStorage.removeItem(key):localStorage.setItem(key,JSON.stringify(value)); } catch { throw {code:'storage'}; } }
const attemptKey=()=> 'hexlive.characterAttempt.'+session.playerId;
function clearAttempt() { storageSet(attemptKey(),null);pending=null; }
function localize() { document.documentElement.lang=lang; document.documentElement.dataset.theme=theme==='light'?'light':'dark';$('language').value=lang;$('theme').value=theme;document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));message(notice,noticeError);if(auth)auth.languageCode=lang;render(); }
$('language').addEventListener('change',()=>{lang=$('language').value;try{localStorage.setItem('hexlive.language',lang);}catch{}localize();});
$('theme').addEventListener('change',()=>{theme=$('theme').value;try{localStorage.setItem('hexlive.theme',theme);}catch{}localize();});
async function run(fn) { if(busy)return;const restoreFocus=main.contains(document.activeElement);busy=true;main.inert=true;main.setAttribute('aria-busy','true');message();try{await fn();}catch(e){if(e.code==='email_not_verified')view='verify';message(strings[e.code]?e.code:'unknownError',true);}finally{busy=false;main.inert=false;main.setAttribute('aria-busy','false');render();if(restoreFocus)main.querySelector('h2')?.focus();} }
async function api(path,method='GET',body,authorized=true) {
 const headers={}; if(body!==undefined)headers['Content-Type']='application/json';if(authorized&&session)headers.Authorization='Bearer '+session.sessionToken;
 let response;try{response=await fetch('/api/accounts/v1'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(20000)});}catch{throw {code:'network'};}
 let data=null;try{if(response.status!==204)data=await response.json();}catch{throw {code:'network'};}
 if(!response.ok){if(response.status===401&&authorized){storageSet(SESSION_KEY,null);session=null;view='auth';throw{code:'sessionExpired'};}throw{code:data?.error||'unknownError',status:response.status};}return data;
}
async function initFirebase() {
 if(auth)return;if(!config?.apiKey||!config.authDomain)throw {code:'configuration'};
 try { const [app,authSdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js')]);sdk=authSdk;auth=sdk.getAuth(app.initializeApp({projectId:config.projectId,apiKey:config.apiKey,authDomain:config.authDomain}));if(config.emulator)sdk.connectAuthEmulator(auth,'http://'+config.emulator,{disableWarnings:true});auth.languageCode=lang;await sdk.setPersistence(auth,sdk.browserSessionPersistence);await auth.authStateReady(); }catch(e){throw {code:e.code||'network'};}
}
async function exchange(user) { const idToken=await user.getIdToken(true);const fresh=await api('/session','POST',{idToken},false);storageSet(SESSION_KEY,{sessionToken:fresh.sessionToken,playerId:fresh.playerId,expiresAt:fresh.expiresAt});session=fresh;await refreshMe(); }
async function refreshMe() {
 const nextMe=await api('/me');
 if(nextMe.character?.alive&&!nextMe.needsNewCharacter){me=nextMe;view='play';clearAttempt();return;}
 // Do not leave a half-updated play screen if fetching options fails after a death.
 const nextOptions=await api('/character/options');
 me=nextMe;options=nextOptions;pending=storageGet(attemptKey());draft=null;step=0;view='create';
 if(me.needsNewCharacter)message('character_died_create_new');
}
async function bootstrap() {
 view='loading';render();config=await api('/client-config','GET',undefined,false);
 // A saved game session remains useful even if the Firebase CDN is temporarily unavailable.
 session=storageGet(SESSION_KEY);
 if(session&&(!session.sessionToken||!session.playerId||!(Date.parse(session.expiresAt)>Date.now()))){storageSet(SESSION_KEY,null);session=null;}
 if(session){try{await refreshMe();return;}catch(e){if(e.code!=='sessionExpired')throw e;}}
 view='auth';await initFirebase();
 const redirected=sessionStorage.getItem('hexlive.redirect');sessionStorage.removeItem('hexlive.redirect');
 const result=await sdk.getRedirectResult(auth);
 if(result){await exchange(result.user);return;}
 if(redirected){message('redirectFailed',true);return;}
 if(auth.currentUser){if(config.requireVerifiedEmail&&!auth.currentUser.emailVerified&&auth.currentUser.providerData.some(p=>p.providerId==='password')){view='verify';message('email_not_verified');}else await exchange(auth.currentUser);}
}
async function providerLogin(provider) {
 await initFirebase();const p=provider==='google'?new sdk.GoogleAuthProvider():new sdk.OAuthProvider('apple.com');
 try{const result=await sdk.signInWithPopup(auth,p);await exchange(result.user);}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){sessionStorage.setItem('hexlive.redirect','1');await sdk.signInWithRedirect(auth,p);}else throw e;}
}
async function logout() {
 if(session){try{await api('/session','DELETE');}catch(e){if(e.code!=='sessionExpired')throw e;}}
 storageSet(SESSION_KEY,null);session=null;pending=null;draft=null;view='auth';
 await initFirebase();await sdk.signOut(auth);message('signedOut');
}
function field(parent,key,node) { const wrap=el('div',null,{class:'field'});node.id='field-'+key;wrap.append(el('label',t(key),{for:node.id}),node);parent.append(wrap);return node; }
function actions(parent,...buttons) {const row=el('div',null,{class:'actions'});row.append(...buttons);parent.append(row);}
function renderAuth() {
 main.append(el('h2',t('login')));const providers=el('div',null,{class:'provider-list'});
 for(const p of ['google','apple'])if(config?.providers.includes(p))providers.append(button(p,()=>providerLogin(p)));
 main.append(providers);if(!config?.providers.includes('password'))return;
 main.append(el('div',t('or'),{class:'divider'}));const form=el('form',null);const email=field(form,'email',el('input',null,{type:'email',autocomplete:'email',required:'',maxlength:'254'}));const password=field(form,'password',el('input',null,{type:'password',autocomplete:'current-password',required:''}));form.append(el('small',t('passwordHint')));
 async function submit(register) {if(!form.reportValidity())return;await initFirebase();const result=await (register?sdk.createUserWithEmailAndPassword:sdk.signInWithEmailAndPassword)(auth,email.value.trim(),password.value);if(register){try{await sdk.sendEmailVerification(result.user,{url:location.origin+'/login/'});}catch(_){}}if(register&&config.requireVerifiedEmail){view='verify';message('sent');}else await exchange(result.user);}
 const login=el('button',t('login'),{type:'submit',class:'primary'});form.addEventListener('submit',e=>{e.preventDefault();run(()=>submit(false));});
 actions(form,login,button('register',()=>submit(true)));actions(form,button('reset',async()=>{if(!email.reportValidity())return;await initFirebase();await sdk.sendPasswordResetEmail(auth,email.value.trim());message('resetSent');}));main.append(form);
}
function renderVerify() {main.append(el('h2',t('verifyTitle')),el('p',t('email_not_verified')));actions(main,button('verified',async()=>{await initFirebase();if(!auth.currentUser){view='auth';return;}await sdk.reload(auth.currentUser);await exchange(auth.currentUser);},true),button('resend',async()=>{await initFirebase();if(!auth.currentUser){view='auth';return;}await sdk.sendEmailVerification(auth.currentUser,{url:location.origin+'/login/'});message('sent');}));actions(main,button('logout',logout));}
function makeDraft() {
 const b=options.bodies[0];return {name:'',body:b?.id||'',skin:b?.skins[0]||'',hair:b?.hair[0]||'none',hairColour:'prototype',eyes:b?.eyes[0]||'',voice:b?.sex==='male'?'kshishtof':'marta',traits:[],attributes:options.attributes.map(id=>({id,value:Math.min(.5,Math.floor(options.attributeBudget/options.attributes.length*100)/100)})),skills:options.skills.map(id=>({id,value:0})),camp:options.camps.find(c=>c.hasSpace)?.id||''};
}
function select(parent,key,values,labels) {const node=el('select',null);for(const value of values)node.append(el('option',labels?labels(value):t(value||'original'),{value}));node.value=draft[key];if(node.selectedIndex<0){node.selectedIndex=0;draft[key]=node.value;}field(parent,key,node);node.addEventListener('change',()=>{draft[key]=node.value;if(key==='body'){const b=options.bodies.find(b=>b.id===draft.body);draft.skin=b.skins[0]||'';draft.hair=b.hair[0]||'none';draft.eyes=b.eyes[0]||'';draft.voice=b.sex==='male'?'kshishtof':'marta';draft.hairColour='prototype';render();}if(key==='hair'){draft.hairColour='prototype';render();}});return node;}
function appearance(parent) {
 const name=field(parent,'name',el('input',null,{type:'text',required:'',maxlength:'64',autocomplete:'nickname'}));name.value=draft.name;name.addEventListener('input',()=>draft.name=name.value);
 const grid=el('div',null,{class:'grid'});select(grid,'body',options.bodies.map(b=>b.id),id=>t(options.bodies.find(b=>b.id===id).sex));const b=options.bodies.find(b=>b.id===draft.body);select(grid,'skin',b.skins);select(grid,'hair',b.hair);const colours=options.hair.find(h=>h.id===draft.hair)?.colours||[];if(draft.hair!=='none'&&colours.length)select(grid,'hairColour',colours);if(b.eyes.some(id=>id!==''))select(grid,'eyes',b.eyes);if(options.voices.length)select(grid,'voice',options.voices);parent.append(grid);
}
const opposites={Slob:'Neat',Neat:'Slob',Lazy:'Diligent',Diligent:'Lazy',Coward:'Brave',Brave:'Coward'};
function sliders(parent,key,budget) {
 const set=el('fieldset',null);set.append(el('legend',t(key)));const remaining=el('p',null,{class:'budget','aria-live':'polite'});set.append(remaining);
 const update=()=>{const left=Math.round((budget-draft[key].reduce((sum,v)=>sum+v.value,0))*100)/100;remaining.textContent=t('remaining',{left:left.toFixed(2),total:budget.toFixed(2)});remaining.classList.toggle('error',left<0);};
 draft[key].forEach((v,i)=>{const id=key+'-'+i,wrap=el('div',null,{class:'field'}),label=el('div',null,{class:'slider-label'}),output=el('output',v.value.toFixed(2),{for:id});label.append(el('label',t(v.id),{for:id}),output);const input=el('input',null,{id,type:'range',min:'0',max:'1',step:'0.01',value:v.value});input.addEventListener('input',()=>{v.value=Number(input.value);output.textContent=v.value.toFixed(2);update();});wrap.append(label,input);set.append(wrap);});update();parent.append(set);
}
function abilities(parent) {
 const set=el('fieldset',null),choices=el('div',null,{class:'choices'});set.append(el('legend',t('traits')),el('p',t('traitHint'),{class:'muted'}));
 for(const id of options.traits){const label=el('label',null,{class:'choice'}),input=el('input',null,{type:'checkbox'});input.checked=draft.traits.includes(id);input.addEventListener('change',()=>{draft.traits=draft.traits.filter(x=>x!==id&&(!input.checked||x!==opposites[id]));if(input.checked)draft.traits.push(id);choices.querySelectorAll('input').forEach(c=>c.checked=draft.traits.includes(c.value));});input.value=id;label.append(input,el('span',t(id)));choices.append(label);}set.append(choices);parent.append(set,el('p',t('budgetHint'),{class:'muted'}));sliders(parent,'attributes',options.attributeBudget);sliders(parent,'skills',options.skillBudget);
}
function camps(parent) {
 parent.append(el('p',t('campHint'),{class:'muted'}));const set=el('fieldset',null);set.append(el('legend',t('camp')));
 for(const c of options.camps){const label=el('label',null,{class:'choice camp'}),input=el('input',null,{type:'radio',name:'camp',value:c.id});input.checked=draft.camp===c.id;input.disabled=!c.hasSpace;input.addEventListener('change',()=>draft.camp=c.id);const info=el('span',null);const number=c.id==='Colony'?'1':c.id.replace(/^Colony/,'');info.append(el('strong',t(strings[c.nameKey]?c.nameKey:'campFallback',{number})));if(c.descriptionKey&&strings[c.descriptionKey])info.append(el('small',t(c.descriptionKey)));info.append(el('small',t(c.hasSpace?'space':'full')));label.append(input,info);set.append(label);}parent.append(set);if(!options.camps.some(c=>c.hasSpace))parent.append(el('p',t('noCamps')));
}
function budgetValid() {return draft.attributes.reduce((s,v)=>s+v.value,0)<=options.attributeBudget+1e-6&&draft.skills.reduce((s,v)=>s+v.value,0)<=options.skillBudget+1e-6;}
async function createCharacter() {
 const perform=async()=>{
 // Re-read inside the per-origin Web Lock, so two tabs retry the same saved attempt.
 pending=storageGet(attemptKey());
 if(!pending){if(!draft.name.trim())throw{code:'nameRequired'};if(!budgetValid())throw{code:'budget'};if(!options.camps.some(c=>c.id===draft.camp&&c.hasSpace))throw{code:'noCamps'};const requestId=crypto.randomUUID().replaceAll('-','');pending={...draft,name:draft.name.trim(),requestId};storageSet(attemptKey(),pending);}
 try{await api('/character','POST',pending);}catch(e){if(e.status===400||e.status===409){clearAttempt();if(e.code==='character_alive'){await refreshMe();return;}}throw e;}
 clearAttempt();await refreshMe();if(view==='play')message('created');
 };
 if(navigator.locks)await navigator.locks.request('hexlive.character.'+session.playerId,perform);else await perform();
}
function renderCreate() {
 main.append(el('h2',t('create')));
 if(pending){main.append(el('p',t('pending')));actions(main,button('retryCreation',createCharacter,true),button('refresh',refreshMe));actions(main,button('logout',logout));return;}
 if(!options?.bodies.length){main.append(el('p',t('noBodies')));actions(main,button('refresh',refreshMe),button('logout',logout));return;}
 draft??=makeDraft();const steps=el('ol',null,{class:'steps'});['appearance','abilities','camp'].forEach((key,i)=>steps.append(el('li',t(key),i===step?{'aria-current':'step'}:{})));main.append(steps);
 const form=el('form',null);form.addEventListener('submit',e=>e.preventDefault());[appearance,abilities,camps][step](form);main.append(form);
 const back=button('back',()=>{step--;render();});back.disabled=step===0;
 const forward=step===2?button('create',createCharacter,true):button('next',()=>{if(step===0&&!draft.name.trim())throw{code:'nameRequired'};if(step===1&&!budgetValid())throw{code:'budget'};step++;render();main.querySelector('h2')?.focus();},true);
 if(step===2)forward.disabled=!options.camps.some(c=>c.id===draft.camp&&c.hasSpace);
 actions(main,back,forward);actions(main,button('refresh',refreshMe),button('logout',logout));
}
function render() {
 const focusedId=main.contains(document.activeElement)?document.activeElement.id:'';
 main.replaceChildren();if(view==='loading'){main.append(el('p',t('loading')),button('retry',bootstrap));return;}
 if(view==='auth')renderAuth();else if(view==='verify')renderVerify();else if(view==='create')renderCreate();else if(view==='play'){main.append(el('h2',t('ready')),el('p',me.character.name,{class:'character-name'}),el('a',t('play'),{href:'/play/',class:'play-link'}));actions(main,button('refresh',refreshMe),button('logout',logout));}
 const heading=main.querySelector('h2');if(heading)heading.tabIndex=-1;if(focusedId)$(focusedId)?.focus();
}
localize();run(bootstrap);
</script>
