<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f12">
<title>HexLive</title>
<style>
/* §171.12: the site in front of the game. Palette = ui/theme.css of the web client. */
:root{color-scheme:dark;--bg:#0b0f12;--panel:rgb(19 24 28 / .78);--panel-solid:#13181c;--raised:#222a31;--hover:#2e3841;--stroke:rgb(255 255 255 / .12);--stroke-strong:rgb(255 255 255 / .22);--ink:#e7ecef;--muted:#9aa6ad;--gold:#f0b45c;--gold-hover:#f7c57a;--on-gold:#1a1206;--leaf:#c1db8d;--error:#ff9f8f;--focus:rgb(240 180 92 / .8);--radius:18px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* ---- hero: the title art of the game, so the jump into Unity is seamless ---- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;isolation:isolate;overflow:hidden}
.hero__art{position:absolute;inset:0;z-index:-2;background:#16202a url('/login/art/hero.webp') 68% 30%/cover no-repeat;animation:drift 40s ease-in-out infinite alternate}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgb(11 15 18 / .94) 0%,rgb(11 15 18 / .78) 30%,rgb(11 15 18 / .2) 58%,rgb(11 15 18 / 0) 75%),linear-gradient(0deg,var(--bg) 0%,rgb(11 15 18 / 0) 26%),linear-gradient(180deg,rgb(11 15 18 / .55) 0%,rgb(11 15 18 / 0) 18%)}
@keyframes drift{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.5%,-1%,0)}}
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:1rem;padding:clamp(1rem,2.5vw,1.6rem) clamp(1rem,4vw,3.5rem)}
.logo{width:clamp(190px,18vw,270px);height:auto;display:block;margin:0 0 -.4rem -.4rem;filter:drop-shadow(0 6px 18px rgb(0 0 0 / .55))}
.langs{display:flex;padding:3px;border-radius:999px;background:rgb(11 15 18 / .55);border:1px solid var(--stroke);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.langs button{border:0;background:none;padding:.35rem .8rem;border-radius:999px;font-size:.85rem;font-weight:650;color:var(--muted);cursor:pointer;min-height:34px}
.langs button[aria-pressed=true]{background:var(--raised);color:var(--ink)}
.hero__body{flex:1;display:flex;align-items:center;padding:0 clamp(1rem,4vw,3.5rem) clamp(2.5rem,6vh,4rem)}
.hero__column{width:min(100%,500px);display:flex;flex-direction:column;gap:1.2rem;animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.eyebrow:before{content:"";width:12px;height:14px;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
h1{font-size:clamp(2.2rem,4.4vw,3.3rem);line-height:1.02;font-weight:850;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 24px rgb(0 0 0 / .45)}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:#c5ced3;font-size:1.06rem;max-width:40ch;text-shadow:0 1px 12px rgb(0 0 0 / .6)}

/* ---- the card: sign-in, then the player ---- */
.card{position:relative;background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius);padding:1.5rem;box-shadow:0 1.5rem 3rem rgb(0 0 0 / .45),0 .25rem .75rem rgb(0 0 0 / .3);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);min-height:132px}
.card h2{font-size:1.15rem;font-weight:750;margin-bottom:1rem}
.card .lead{margin-bottom:1rem}
.card h2:focus{outline:none}
.btn{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;min-height:50px;padding:.75rem 1.1rem;border-radius:12px;border:1px solid var(--stroke-strong);background:var(--raised);font-weight:650;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn--google{background:#fff;color:#1f1f1f;border-color:#fff}
.btn--google:hover{background:#f1f3f4;box-shadow:0 0 0 4px rgb(255 255 255 / .12)}
.btn--apple{background:#000;color:#fff;border-color:#000}
.btn--play{min-height:58px;font-size:1.15rem;font-weight:800;letter-spacing:.02em;background:linear-gradient(180deg,var(--gold-hover),var(--gold));color:var(--on-gold);border-color:var(--gold);box-shadow:0 10px 28px rgb(240 180 92 / .28)}
.btn--play:hover{background:linear-gradient(180deg,#fbd394,var(--gold-hover));box-shadow:0 12px 34px rgb(240 180 92 / .42);transform:translateY(-1px)}
.btn--play svg{width:22px;height:22px}
.btn--ghost{background:none;border-color:transparent;color:var(--muted);min-height:40px;font-weight:600}
.btn--ghost:hover{background:rgb(255 255 255 / .06);color:var(--ink)}
.btn--primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn--primary:hover{background:var(--gold-hover)}
.stack{display:grid;gap:.7rem}
.row{display:flex;gap:.6rem}.row>*{flex:1;min-width:0}
.email{margin-top:1rem;border-top:1px solid var(--stroke);padding-top:.9rem}
.email summary{cursor:pointer;color:var(--muted);font-size:.92rem;list-style:none;display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.25rem;border-radius:8px}
.email summary::-webkit-details-marker{display:none}
.email summary:after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.email[open] summary:after{transform:rotate(225deg) translateY(-2px)}
.email summary:hover{color:var(--ink)}
.email form{display:grid;gap:.8rem;margin-top:.9rem}
.field{display:grid;gap:.3rem}
.field label{font-size:.82rem;color:var(--muted)}
.field input{width:100%;min-height:46px;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--stroke-strong);background:rgb(11 15 18 / .6)}
.field input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgb(240 180 92 / .25)}
small{display:block;color:var(--muted);font-size:.8rem}
.linkish{background:none;border:0;padding:.2rem;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start}
.linkish:hover{color:var(--ink)}
#status{font-size:.92rem;padding:.7rem .9rem;border-radius:10px;background:rgb(255 255 255 / .06);border:1px solid var(--stroke);overflow-wrap:anywhere}
#status:empty{display:none}
#status.error{color:var(--error);border-color:rgb(255 159 143 / .35);background:rgb(120 30 28 / .25)}

/* the spinner that turns while Google answers */
.busy{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;border-radius:inherit;background:rgb(15 20 24 / .86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-align:center;padding:1rem}
.card[aria-busy=true] .busy{display:flex;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spinner{position:relative;width:56px;height:56px}
.spinner i{position:absolute;inset:0;background:conic-gradient(from 0deg,rgb(240 180 92 / 0),var(--gold));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:spin 1.1s linear infinite}
.spinner:after{content:"";position:absolute;inset:6px;background:var(--panel-solid);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.spinner b{position:absolute;inset:19px;z-index:1;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:pulse 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
.busy p{color:var(--ink);font-weight:600}

/* the signed-in player */
.profile{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.avatar{position:relative;width:64px;height:72px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#c97f2c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.avatar img,.avatar span{width:58px;height:66px;object-fit:cover;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--raised);display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:var(--gold)}
.who{min-width:0}
.who__hello{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.who__name{font-size:1.3rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.who__mail{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;margin-top:.35rem;font-size:.75rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:rgb(255 255 255 / .08);border:1px solid var(--stroke);color:var(--muted)}
.chip svg{width:12px;height:12px}
.hero-line{display:flex;align-items:center;gap:.8rem;padding:.85rem 1rem;margin-bottom:1rem;border-radius:12px;background:rgb(255 255 255 / .05);border:1px solid var(--stroke)}
.hero-line__dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.hero-line[data-state=alive] .hero-line__dot{background:var(--leaf);box-shadow:0 0 0 4px rgb(193 219 141 / .18);animation:breathe 2.4s ease-in-out infinite}
.hero-line[data-state=dead] .hero-line__dot{background:var(--error)}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgb(193 219 141 / .06)}}
.hero-line small{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero-line strong{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.muted{display:block;color:var(--muted);font-size:.9rem}
.after{display:flex;justify-content:center;margin-top:.6rem}
.skeleton{display:grid;place-items:center;min-height:100px}
.signed-in .hero__column>.lead{display:none}

/* ---- below the fold: three pictures, a line each ---- */
.features{padding:clamp(2.5rem,6vw,5rem) clamp(1rem,4vw,3.5rem) 2rem;position:relative}
.features__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2vw,1.6rem);max-width:1240px;margin:0 auto}
.feature{border-radius:var(--radius);overflow:hidden;background:var(--panel-solid);border:1px solid var(--stroke);transition:transform .25s,border-color .25s;box-shadow:0 1rem 2.5rem rgb(0 0 0 / .35)}
.feature:hover{transform:translateY(-4px);border-color:var(--stroke-strong)}
.feature__img{aspect-ratio:4/3;background:#1a2229 center/cover no-repeat}
.feature__img--map{background-image:url('/login/art/island-map.webp')}
.feature__img--camp{background-image:url('/login/art/night-camp.webp')}
.feature__img--wild{background-image:url('/login/art/wild-jungle.webp')}
.feature__text{padding:1.1rem 1.25rem 1.3rem}
.feature h3{font-size:1.1rem;font-weight:800;margin-bottom:.3rem}
.feature p{color:var(--muted);font-size:.95rem}
.band{margin:clamp(2.5rem,6vw,4.5rem) auto 0;max-width:1240px;border-radius:calc(var(--radius) + 6px);overflow:hidden;position:relative;min-height:260px;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:2.2rem 2rem;background:#123 url('/login/art/island.webp') center 65%/cover no-repeat}
.band:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(11 15 18 / .62),rgb(11 15 18 / 0) 60%)}
.band p{position:relative;font-size:clamp(1.3rem,2.6vw,2rem);font-weight:850;letter-spacing:-.01em;text-shadow:0 2px 18px rgb(0 0 0 / .55);max-width:24ch}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:2rem 1rem 2.5rem}
@media(max-width:860px){
 .hero__art{background-position:62% 20%}
 .hero:after{background:linear-gradient(0deg,var(--bg) 0%,rgb(11 15 18 / .9) 45%,rgb(11 15 18 / .35) 75%,rgb(11 15 18 / .5) 100%)}
 .hero__body{align-items:flex-end}
 .features__grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

 <div class="hero__art" aria-hidden="true"></div>
 <header class="topbar">
  <div class="langs" role="group" aria-label="Language / Язык">
   <button type="button" id="lang-ru" lang="ru">RU</button>
   <button type="button" id="lang-en" lang="en">EN</button>
  </div>
 </header>
 <div class="hero__body">
  <div class="hero__column">
   <img class="logo" src="/login/art/logo.webp" alt="HexLive" width="720" height="479">
   <span class="eyebrow" data-i18n="eyebrow"></span>
   <h1><span data-i18n="title"></span> <em data-i18n="titleAccent"></em></h1>
   <p class="lead" data-i18n="intro"></p>
   <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
   <div class="card" id="card" aria-busy="true">
    <main id="main"></main>
    <div class="busy" aria-hidden="true"><div class="spinner"><i></i><b></b></div><p id="busy-text"></p></div>
   </div>

 </div>
</section>

 <div class="features__grid">

  <article class="feature"><div class="feature__img feature__img--camp" role="img" data-i18n-label="f2"></div><div class="feature__text"><h3 data-i18n="f2"></h3><p data-i18n="f2text"></p></div></article>
  <article class="feature"><div class="feature__img feature__img--wild" role="img" data-i18n-label="f3"></div><div class="feature__text"><h3 data-i18n="f3"></h3><p data-i18n="f3text"></p></div></article>
 </div>

</section>
<footer data-i18n="footer"></footer>

async function refreshMe() { me = await api('/me'); view = 'play'; if (me.needsNewCharacter) message('character_died_create_new'); }

function field(parent, key, node) { const wrap = el('div', null, { class: 'field' }); node.id = 'field-' + key; wrap.append(el('label', t(key), { for: node.id }), node); parent.append(wrap); return node; }
function renderAuth() {

 const providers = el('div', null, { class: 'stack' });
 if (config?.providers.includes('google')) providers.append(button('google', () => providerLogin('google'), 'btn btn--google', 'google', 'waitGoogle'));
 if (config?.providers.includes('apple')) providers.append(button('apple', () => providerLogin('apple'), 'btn btn--apple', 'apple', 'waitApple'));

 const details = el('details', null, { class: 'email' }); details.append(el('summary', t('or')));
 if (!config.providers.includes('google') && !config.providers.includes('apple')) details.open = true;

}
function renderVerify() {
 main.append(el('h2', t('verifyTitle')), el('p', t('email_not_verified'), { class: 'lead' }));
 const s = el('div', null, { class: 'stack' }); main.append(s);
 s.append(button('verified', async () => { await initFirebase(); if (!auth.currentUser) { view = 'auth'; return; } await sdk.reload(auth.currentUser); await exchange(auth.currentUser); }, 'btn btn--primary'),
  button('resend', async () => { await initFirebase(); if (!auth.currentUser) { view = 'auth'; return; } await sdk.sendEmailVerification(auth.currentUser, { url: location.origin + '/login/' }); message('sent'); }),
  button('logout', logout, 'btn btn--ghost'));
}
function renderPlay() {

 if (profile?.email) who.append(el('div', profile.email, { class: 'who__mail', title: profile.email }));

 if (via) { const chip = el('span', null, { class: 'chip' }); if (via[1]) chip.append(icon(via[1])); chip.append(el('span', t(via[0]))); who.append(chip); }
 head.append(avatar, who); main.append(head);
 const alive = me?.character?.alive;
 const line = el('div', null, { class: 'hero-line', 'data-state': alive ? 'alive' : me?.needsNewCharacter ? 'dead' : 'none' });
 const text = el('div');

 else text.append(el('strong', t(me?.needsNewCharacter ? 'diedHero' : 'noHero')), el('span', t('noHeroHint'), { class: 'muted' }));

}
function render() {

localize(); run(bootstrap, 'loading');
