[project]
name = "wardrobe"
version = "0.1.0"
description = "Конвейер: архив с ассетами DAZ -> готовые Wear-префабы HexLive"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",       # ресайз текстур и композит альфы
    "gdown>=5.2",         # публичные ссылки Google Drive (у них свой танец с подтверждением)
    "requests>=2.31",     # прямые HTTP-ссылки и файлообменники
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wardrobe"]
